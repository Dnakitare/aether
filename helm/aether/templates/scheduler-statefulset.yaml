{{- if .Values.scheduler.enabled }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "aether.fullname" . }}-scheduler
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "aether.scheduler.labels" . | nindent 4 }}
spec:
  serviceName: {{ include "aether.fullname" . }}-scheduler
  replicas: {{ .Values.scheduler.replicaCount }}
  selector:
    matchLabels:
      {{- include "aether.scheduler.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- with .Values.scheduler.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "aether.scheduler.selectorLabels" . | nindent 8 }}
    spec:
      {{- include "aether.imagePullSecrets" . | nindent 6 }}
      serviceAccountName: {{ include "aether.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.scheduler.securityContext | nindent 8 }}
      containers:
        - name: aether-scheduler
          image: {{ include "aether.image" (dict "imageRoot" .Values.scheduler.image "global" .Values.global) }}
          imagePullPolicy: {{ .Values.scheduler.image.pullPolicy }}
          command:
            - /usr/local/bin/aether
            - scheduler
            - --config=/etc/aether/config
          ports:
            - name: http
              containerPort: {{ .Values.scheduler.service.targetPort }}
              protocol: TCP
          env:
            # Database password from secret
            - name: AETHER_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "aether.postgresql.secretName" . }}
                  key: password
            # Redis password from secret (if enabled)
            {{- if .Values.redis.auth.enabled }}
            - name: AETHER_REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "aether.redis.secretName" . }}
                  key: redis-password
            {{- end }}
          envFrom:
            - configMapRef:
                name: {{ include "aether.fullname" . }}-config
          resources:
            {{- toYaml .Values.scheduler.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/aether
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
        {{- if not .Values.scheduler.persistence.enabled }}
        - name: data
          emptyDir: {}
        {{- end }}
      {{- with .Values.scheduler.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.scheduler.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.scheduler.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
  {{- if .Values.scheduler.persistence.enabled }}
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          {{- include "aether.scheduler.labels" . | nindent 10 }}
      spec:
        accessModes:
          - {{ .Values.scheduler.persistence.accessMode }}
        {{- if .Values.scheduler.persistence.storageClass }}
        {{- if (eq "-" .Values.scheduler.persistence.storageClass) }}
        storageClassName: ""
        {{- else }}
        storageClassName: {{ .Values.scheduler.persistence.storageClass }}
        {{- end }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.scheduler.persistence.size }}
  {{- end }}
{{- end }}
