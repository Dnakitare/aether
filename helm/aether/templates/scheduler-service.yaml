{{- if .Values.scheduler.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "aether.fullname" . }}-scheduler
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "aether.scheduler.labels" . | nindent 4 }}
spec:
  type: {{ .Values.scheduler.service.type }}
  clusterIP: None  # Headless service for StatefulSet
  ports:
    - port: {{ .Values.scheduler.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "aether.scheduler.selectorLabels" . | nindent 4 }}
{{- end }}
