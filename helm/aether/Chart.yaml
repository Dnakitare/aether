apiVersion: v2
name: aether
description: A Helm chart for deploying Aether Runtime on Kubernetes
type: application
version: 0.2.0
appVersion: "0.2.0-beta"

keywords:
  - aether
  - runtime
  - agents
  - containers

home: https://github.com/dnakitare/aether
sources:
  - https://github.com/dnakitare/aether

maintainers:
  - name: Aether Team
    email: aether@kitumsystems.com

dependencies:
  - name: postgresql
    version: "~12"
    repository: "https://charts.bitnami.com/bitnami"
    condition: postgresql.enabled
  - name: redis
    version: "~17"
    repository: "https://charts.bitnami.com/bitnami"
    condition: redis.enabled
