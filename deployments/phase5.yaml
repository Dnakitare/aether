version: '3.8'

# Local stack: Redis for rate limiting, PostgreSQL for checkpoints
services:
  # Redis - Rate limiting and state management
  redis:
    image: redis:7-alpine
    container_name: aether-redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    volumes:
      - redis-data:/data
    networks:
      - aether
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # PostgreSQL - Checkpoints, audit logs, costs
  postgres:
    image: postgres:16-alpine
    container_name: aether-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: aether
      POSTGRES_PASSWORD: aether
      POSTGRES_DB: aether
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - aether
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aether"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Commander - Redis UI (optional)
  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: aether-redis-commander
    depends_on:
      - redis
    ports:
      - "8082:8081"
    environment:
      REDIS_HOSTS: local:redis:6379
    networks:
      - aether

volumes:
  redis-data:
  postgres-data:

networks:
  aether:
    driver: bridge
