apiVersion: v1
kind: ConfigMap
metadata:
  name: aether-distributed-config
  namespace: aether
  labels:
    app.kubernetes.io/name: aether
    app.kubernetes.io/component: config
data:
  # Kafka broker endpoints (comma-separated)
  KAFKA_BROKERS: "kafka-0.kafka-headless.aether.svc.cluster.local:9092,kafka-1.kafka-headless.aether.svc.cluster.local:9092,kafka-2.kafka-headless.aether.svc.cluster.local:9092"

  # Kafka consumer group for Aether workers
  KAFKA_CONSUMER_GROUP: "aether-workers"

  # Kafka topics
  KAFKA_TOPIC_AGENT_EVENTS: "aether.agent.events"
  KAFKA_TOPIC_SCHEDULER: "aether.scheduler.tasks"
  KAFKA_TOPIC_AUDIT: "aether.audit.log"

  # etcd endpoints (comma-separated)
  ETCD_ENDPOINTS: "etcd-0.etcd-headless.aether.svc.cluster.local:2379,etcd-1.etcd-headless.aether.svc.cluster.local:2379,etcd-2.etcd-headless.aether.svc.cluster.local:2379"

  # etcd key prefix for Aether distributed state
  ETCD_KEY_PREFIX: "/aether"

  # Scheduler mode: distributed uses Kafka + etcd for coordination
  SCHEDULER_MODE: "distributed"

  # Number of scheduler worker replicas to expect (used for quorum)
  SCHEDULER_WORKER_COUNT: "3"

  # Leader election lease duration
  SCHEDULER_LEASE_DURATION: "15s"
  SCHEDULER_RENEW_DEADLINE: "10s"
  SCHEDULER_RETRY_PERIOD: "2s"
