apiVersion: v1
kind: Service
metadata:
  name: aether
  namespace: aether
  labels:
    app.kubernetes.io/name: aether
    app.kubernetes.io/component: server
spec:
  selector:
    app.kubernetes.io/name: aether
    app.kubernetes.io/component: server
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
  type: ClusterIP
---
# Headless service for metrics scraping by Prometheus
apiVersion: v1
kind: Service
metadata:
  name: aether-metrics
  namespace: aether
  labels:
    app.kubernetes.io/name: aether
    app.kubernetes.io/component: server
spec:
  selector:
    app.kubernetes.io/name: aether
    app.kubernetes.io/component: server
  ports:
    - name: metrics
      port: 9091
      targetPort: metrics
      protocol: TCP
  clusterIP: None
