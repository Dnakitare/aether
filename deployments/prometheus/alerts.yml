groups:
  - name: aether_agents
    interval: 30s
    rules:
      - alert: HighAgentErrorRate
        expr: rate(aether_agent_errors_total[5m]) > 0.1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High agent error rate detected"
          description: "Agent error rate is {{ $value }} errors/sec for tenant {{ $labels.tenant_id }}"

      - alert: AgentStartupSlow
        expr: histogram_quantile(0.95, rate(aether_agent_startup_duration_seconds_bucket[5m])) > 10
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Slow agent startup times"
          description: "P95 agent startup time is {{ $value }}s for tenant {{ $labels.tenant_id }}"

      - alert: AgentFailureRateHigh
        expr: rate(aether_agent_errors_total[5m]) > 0.1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Agent error rate elevated"
          description: "{{ $value | humanize }} agent errors/sec"

      - alert: AgentStartupSlowP95
        expr: histogram_quantile(0.95, rate(aether_agent_startup_duration_seconds_bucket[10m])) > 30
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "P95 agent startup time exceeds 30s"

  - name: aether_api
    interval: 30s
    rules:
      - alert: HighAPILatency
        expr: histogram_quantile(0.95, rate(aether_api_request_duration_seconds_bucket[5m])) > 1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High API latency detected"
          description: "P95 API latency is {{ $value }}s for endpoint {{ $labels.endpoint }}"

      - alert: HighAPIErrorRate
        expr: rate(aether_api_requests_total{status=~"5.."}[5m]) / rate(aether_api_requests_total[5m]) > 0.05
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "High API error rate"
          description: "API error rate is {{ $value | humanizePercentage }} for endpoint {{ $labels.endpoint }}"

  - name: aether_resources
    interval: 30s
    rules:
      - alert: HighCPUUsage
        expr: sum(aether_cpu_usage_cores) by (tenant_id) > 80
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "High CPU usage for tenant"
          description: "Tenant {{ $labels.tenant_id }} is using {{ $value }} CPU cores"

      - alert: HighMemoryUsage
        expr: sum(aether_memory_usage_bytes) by (tenant_id) / 1024 / 1024 / 1024 > 100
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "High memory usage for tenant"
          description: "Tenant {{ $labels.tenant_id }} is using {{ $value }}GB of memory"

  - name: aether_scheduler
    interval: 30s
    rules:
      - alert: HighSchedulingErrorRate
        expr: rate(aether_scheduling_errors_total[5m]) > 0.05
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High scheduling error rate"
          description: "Scheduling error rate is {{ $value }} errors/sec (reason: {{ $labels.reason }})"

  - name: aether_costs
    interval: 1h
    rules:
      - alert: UnexpectedCostSpike
        expr: rate(aether_resource_cost_total[1h]) > 10
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: "Unexpected cost spike detected"
          description: "Cost rate is ${{ $value }}/hour for tenant {{ $labels.tenant_id }}"

  - name: aether_security
    rules:
      - alert: AuthenticationFailureSpike
        expr: rate(http_requests_total{status="401"}[5m]) > 1
        for: 3m
        labels:
          severity: warning
        annotations:
          summary: "Elevated 401 rate — possible credential stuffing"
          description: "{{ $value | humanize }} auth failures/sec on {{ $labels.instance }}"

      - alert: RateLimitRejectionHigh
        expr: rate(http_requests_total{status="429"}[5m]) > 5
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High rate limit rejection rate"
          description: "{{ $value | humanize }} requests/sec being rate-limited"

  - name: aether_database
    rules:
      - alert: PostgresConnectionsHigh
        expr: pg_stat_database_numbackends / pg_settings_max_connections > 0.8
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "PostgreSQL connections above 80%"
