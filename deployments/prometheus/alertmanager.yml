global:
  resolve_timeout: 5m

route:
  group_by: ['alertname']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  receiver: 'default'

receivers:
  - name: 'default'
    # Configure one or more receivers before production use.
    # Examples:
    #
    # Slack:
    #   slack_configs:
    #     - api_url: 'https://hooks.slack.com/services/YOUR/WEBHOOK/URL'
    #       channel: '#aether-alerts'
    #       send_resolved: true
    #
    # PagerDuty:
    #   pagerduty_configs:
    #     - service_key: '<PD_SERVICE_KEY>'
    #
    # Email:
    #   email_configs:
    #     - to: 'oncall@example.com'
    #       from: 'alertmanager@aether.io'
    #       smarthost: 'smtp.example.com:587'

# Inhibition rules: suppress lower-severity alerts when the server is down
inhibit_rules:
  - source_match:
      alertname: 'AetherServerDown'
      severity: 'critical'
    target_match_re:
      severity: 'warning|info'
    equal: ['cluster', 'environment']
