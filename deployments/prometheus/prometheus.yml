global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'aether-dev'
    environment: 'development'

# Alertmanager configuration
alerting:
  alertmanagers:
    - static_configs:
        - targets: []
          # - 'alertmanager:9093'

# Load rules once and periodically evaluate them
rule_files:
  - 'alerts.yml'

# Scrape configurations
scrape_configs:
  # Aether runtime metrics
  - job_name: 'aether'
    static_configs:
      - targets: ['host.docker.internal:9091']
        labels:
          service: 'aether-runtime'

  # Prometheus itself
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # PostgreSQL exporter (optional)
  - job_name: 'postgres'
    static_configs:
      - targets: []
        # - 'postgres-exporter:9187'

  # Redis exporter (optional)
  - job_name: 'redis'
    static_configs:
      - targets: []
        # - 'redis-exporter:9121'
