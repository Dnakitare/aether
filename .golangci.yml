# golangci-lint configuration
run:
  timeout: 5m
  tests: true
  modules-download-mode: readonly

linters:
  enable:
    - errcheck      # Check for unchecked errors
    - gosimple      # Simplify code
    - govet         # Examines Go source code and reports suspicious constructs
    - ineffassign   # Detects ineffectual assignments
    - staticcheck   # Advanced Go linter
    - gofmt         # Checks whether code was gofmt-ed
    - misspell      # Finds commonly misspelled English words
  disable:
    - unused        # Too many false positives
    - goimports     # Handled by gofmt
    - revive        # Too strict for this project
    - gocritic      # Too many style warnings
    - gosec         # Separate security scan job
    - unconvert     # Not critical
    - unparam       # Not critical
    - bodyclose     # Not critical
    - noctx         # Not critical
    - errorlint     # Not critical

linters-settings:
  errcheck:
    check-blank: false
    check-type-assertions: false
    exclude-functions:
      - (*database/sql.DB).Close
      - (*database/sql.Rows).Close
      - (*io.ReadCloser).Close
      - (*os.File).Close
      - (io.Closer).Close

  govet:
    disable:
      - shadow
      - fieldalignment  # Not critical for functionality

  gofmt:
    simplify: true

  revive:
    confidence: 0.8
    rules:
      - name: blank-imports
      - name: context-as-argument
      - name: dot-imports
      - name: error-return
      - name: error-strings
      - name: error-naming
      - name: exported
      - name: if-return
      - name: increment-decrement
      - name: var-naming
      - name: package-comments
      - name: range
      - name: receiver-naming
      - name: time-naming
      - name: unexported-return
      - name: indent-error-flow
      - name: errorf

  gocritic:
    enabled-tags:
      - diagnostic
      - performance
      - style

  gosec:
    excludes:
      - G104  # Audit errors not checked (we use errcheck for this)

issues:
  exclude-use-default: false
  max-issues-per-linter: 0
  max-same-issues: 0

  exclude-rules:
    # Exclude some linters from running on tests files
    - path: _test\.go
      linters:
        - gosec
        - errcheck
        - gocritic

    # Ignore complexity and defer errors in CLI commands
    - path: cmd/
      linters:
        - errcheck  # CLI commands often have defers that are cleanup-only
        - gocyclo
        - funlen

    # Ignore errors in deployment scripts
    - path: deployments/
      linters:
        - errcheck
        - revive

output:
  sort-results: true
