run:
  timeout: 5m
  tests: true
  modules-download-mode: readonly

linters:
  enable:
    - errcheck
    - gosimple
    - govet
    - ineffassign
    - staticcheck
    - typecheck
    - unused

  disable:
    - fieldalignment
    - gocritic
    - revive
    - stylecheck
    - errorlint

linters-settings:
  errcheck:
    check-blank: false
    check-type-assertions: false

  govet:
    enable:
      - shadow
    disable:
      - fieldalignment

  staticcheck:
    checks: ["all"]

issues:
  exclude-rules:
    - path: _test\.go
      linters:
        - errcheck
        - gosec

    - path: (^|/)vendor/
      linters:
        - all

    - text: "G101:"
      linters:
        - gosec
    - text: "G107:"
      linters:
        - gosec
    - text: "G115:"
      linters:
        - gosec

  max-issues-per-linter: 50
  max-same-issues: 10

output:
  formats:
    - format: colored-line-number
  print-issued-lines: true
  print-linter-name: true
  sort-results: true
