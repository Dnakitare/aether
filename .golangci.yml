run:
  timeout: 5m
  tests: true
  modules-download-mode: readonly

linters:
  enable:
    - errcheck
    - gosimple
    - govet
    - ineffassign
    - staticcheck
    - typecheck

  disable:
    - unused  # Temporarily disabled - many false positives
    - gocritic
    - revive
    - stylecheck

linters-settings:
  errcheck:
    check-blank: false
    check-type-assertions: false
    exclude-functions:
      - (*encoding/json.Encoder).Encode
      - (*github.com/fatih/color.Color).Color
      - (*database/sql.Tx).Rollback
      - (*github.com/segmentio/kafka-go.Reader).CommitMessages

  govet:
    disable:
      - shadow  # Too many false positives in defer blocks

  staticcheck:
    checks: ["all", "-SA1029", "-SA4006"]  # Exclude context key and unused value checks

issues:
  exclude-rules:
    - path: _test\.go
      linters:
        - errcheck
        - gosec
        - staticcheck
        - gosimple
        - ineffassign

    - path: tests/
      linters:
        - errcheck
        - staticcheck
        - gosimple
        - ineffassign

    - path: (^|/)vendor/
      linters:
        - all

    - text: "G101:"
      linters:
        - gosec
    - text: "G107:"
      linters:
        - gosec
    - text: "G115:"
      linters:
        - gosec

  max-issues-per-linter: 50
  max-same-issues: 10

output:
  formats:
    - format: colored-line-number
  print-issued-lines: true
  print-linter-name: true
  sort-results: true
