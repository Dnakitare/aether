version: '3.8'

services:
  # PostgreSQL for integration tests
  postgres:
    image: postgres:15-alpine
    container_name: aether-test-postgres
    environment:
      POSTGRES_DB: aether_test
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_test_data:/var/lib/postgresql/data
    networks:
      - aether-test

  # Redis (optional - rate limiter tests use miniredis, but this is available for manual testing)
  redis:
    image: redis:7-alpine
    container_name: aether-test-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 3
    volumes:
      - redis_test_data:/data
    networks:
      - aether-test

volumes:
  postgres_test_data:
    driver: local
  redis_test_data:
    driver: local

networks:
  aether-test:
    driver: bridge
