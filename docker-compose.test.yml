version: '3.8'

services:
  # PostgreSQL for backup/restore tests
  postgres:
    image: postgres:15-alpine
    container_name: aether-test-postgres
    environment:
      POSTGRES_DB: aether_test
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_test_data:/var/lib/postgresql/data
    networks:
      - aether-test

  # etcd for HA failover tests
  etcd:
    image: quay.io/coreos/etcd:v3.5.0
    container_name: aether-test-etcd
    command:
      - /usr/local/bin/etcd
      - --name=etcd-test
      - --data-dir=/etcd-data
      - --listen-client-urls=http://0.0.0.0:2379
      - --advertise-client-urls=http://localhost:2379
      - --listen-peer-urls=http://0.0.0.0:2380
      - --initial-advertise-peer-urls=http://etcd:2380
      - --initial-cluster=etcd-test=http://etcd:2380
      - --initial-cluster-state=new
      - --log-level=info
    ports:
      - "2379:2379"
      - "2380:2380"
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - etcd_test_data:/etcd-data
    networks:
      - aether-test

  # Redis (optional - rate limiter tests use miniredis, but this is available for manual testing)
  redis:
    image: redis:7-alpine
    container_name: aether-test-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 3
    volumes:
      - redis_test_data:/data
    networks:
      - aether-test

volumes:
  postgres_test_data:
    driver: local
  etcd_test_data:
    driver: local
  redis_test_data:
    driver: local

networks:
  aether-test:
    driver: bridge
