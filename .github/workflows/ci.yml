name: CI Enhanced

on:
  push:
    branches: [ main, beta/*, develop ]
  pull_request:
    branches: [ main, develop ]

env:
  GO_VERSION: '1.24'

jobs:
  # Enhanced test job with coverage threshold
  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Verify dependencies
        run: go mod verify

      - name: Run unit tests with coverage
        run: |
          go test -v -race -coverprofile=coverage.out -covermode=atomic ./internal/... ./pkg/...

      - name: Check coverage threshold
        run: |
          coverage=$(go tool cover -func=coverage.out | grep total | awk '{print $3}' | sed 's/%//')
          threshold=50.0
          echo "Total coverage: $coverage%"
          echo "Threshold: $threshold%"
          if (( $(echo "$coverage < $threshold" | bc -l) )); then
            echo "❌ Coverage $coverage% is below threshold $threshold%"
            exit 1
          fi
          echo "✅ Coverage $coverage% meets threshold"

      - name: Generate coverage report
        run: |
          echo "## Test Coverage Report" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          go tool cover -func=coverage.out | tail -20 >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.out
          flags: unittests
          fail_ci_if_error: false

  # Code quality checks
  code-quality:
    name: Code Quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Format check
        run: |
          if [ -n "$(gofmt -s -l .)" ]; then
            echo "❌ Go code is not formatted:"
            gofmt -s -d .
            exit 1
          fi
          echo "✅ Code is properly formatted"

      - name: Go vet
        run: go vet ./...

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest
          args: --timeout=5m

  # Integration tests with PostgreSQL and Redis
  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: aether
          POSTGRES_PASSWORD: aether_test_pass
          POSTGRES_DB: aether_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Wait for services
        run: |
          echo "Waiting for PostgreSQL..."
          for i in {1..30}; do
            if pg_isready -h localhost -p 5432 -U aether > /dev/null 2>&1; then
              echo "✅ PostgreSQL is ready"
              break
            fi
            echo "Waiting for PostgreSQL... ($i/30)"
            sleep 2
          done

          echo "Waiting for Redis..."
          for i in {1..30}; do
            if redis-cli -h localhost ping > /dev/null 2>&1; then
              echo "✅ Redis is ready"
              break
            fi
            echo "Waiting for Redis... ($i/30)"
            sleep 2
          done

      - name: Run integration tests
        env:
          TEST_DATABASE_URL: postgres://aether:aether_test_pass@localhost:5432/aether_test?sslmode=disable
          TEST_REDIS_URL: redis://localhost:6379
        run: |
          echo "Running integration tests with PostgreSQL and Redis..."
          go test -v -race ./tests/integration/... -timeout 15m

      - name: Run checkpoint recovery tests
        env:
          TEST_DATABASE_URL: postgres://aether:aether_test_pass@localhost:5432/aether_test?sslmode=disable
        run: |
          echo "Running checkpoint recovery tests..."
          go test -v ./tests/integration -run TestCheckpointRecovery -timeout 10m

      - name: Run checkpoint integrity tests
        env:
          TEST_DATABASE_URL: postgres://aether:aether_test_pass@localhost:5432/aether_test?sslmode=disable
        run: |
          echo "Running checkpoint integrity tests..."
          go test -v ./tests/integration -run TestCheckpoint -timeout 10m

  # Enhanced security scanning
  security:
    name: Security Scanning
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Run gosec security scanner
        run: |
          go install github.com/securego/gosec/v2/cmd/gosec@latest
          gosec -fmt=json -out=gosec-report.json -no-fail ./...

      - name: Analyze security issues
        run: |
          if [ -f gosec-report.json ]; then
            high=$(jq '[.Issues[] | select(.severity == "HIGH")] | length' gosec-report.json)
            medium=$(jq '[.Issues[] | select(.severity == "MEDIUM")] | length' gosec-report.json)
            low=$(jq '[.Issues[] | select(.severity == "LOW")] | length' gosec-report.json)

            echo "## Security Scan Results" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "| Severity | Count |" >> $GITHUB_STEP_SUMMARY
            echo "|----------|-------|" >> $GITHUB_STEP_SUMMARY
            echo "| High | $high |" >> $GITHUB_STEP_SUMMARY
            echo "| Medium | $medium |" >> $GITHUB_STEP_SUMMARY
            echo "| Low | $low |" >> $GITHUB_STEP_SUMMARY

            if [ "$high" -gt 0 ]; then
              echo "" >> $GITHUB_STEP_SUMMARY
              echo "❌ Found $high high severity security issues" >> $GITHUB_STEP_SUMMARY
              exit 1
            fi
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "✅ No high severity security issues found" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Run vulnerability check
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./... || echo "Vulnerability check completed with warnings"
        continue-on-error: true

      - name: Upload security results
        uses: actions/upload-artifact@v4
        with:
          name: security-scan-results
          path: gosec-report.json
        if: always()

  # Build job
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [test, code-quality]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Build binary
        run: |
          mkdir -p bin
          go build -v -ldflags="-s -w" -o bin/aether ./cmd/aether

      - name: Verify binary
        run: |
          ./bin/aether --version || ./bin/aether --help
          ls -lh bin/aether

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: aether-binary
          path: bin/aether
          retention-days: 7

  # Docker build (on push to main/beta branches)
  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [build, security]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/beta/'))
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract branch name
        id: extract_branch
        run: |
          echo "branch=${GITHUB_REF#refs/heads/}" >> $GITHUB_OUTPUT
          echo "short_sha=${GITHUB_SHA::7}" >> $GITHUB_OUTPUT

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./deployments/docker/Dockerfile
          push: false
          tags: |
            aether-runtime/aether:${{ steps.extract_branch.outputs.branch }}
            aether-runtime/aether:${{ steps.extract_branch.outputs.branch }}-${{ steps.extract_branch.outputs.short_sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Test Docker image
        run: |
          echo "Docker image built successfully"
          echo "Tags: ${{ steps.extract_branch.outputs.branch }}, ${{ steps.extract_branch.outputs.short_sha }}"

  # Summary job
  summary:
    name: CI Summary
    runs-on: ubuntu-latest
    needs: [test, code-quality, integration-tests, security, build]
    if: always()
    steps:
      - name: Generate summary
        run: |
          echo "## CI Pipeline Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Unit Tests | ${{ needs.test.result == 'success' && '✅' || '❌' }} ${{ needs.test.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Code Quality | ${{ needs.code-quality.result == 'success' && '✅' || '❌' }} ${{ needs.code-quality.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Integration Tests | ${{ needs.integration-tests.result == 'success' && '✅' || '❌' }} ${{ needs.integration-tests.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Security Scanning | ${{ needs.security.result == 'success' && '✅' || '❌' }} ${{ needs.security.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Build | ${{ needs.build.result == 'success' && '✅' || '❌' }} ${{ needs.build.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ "${{ needs.test.result }}" != "success" ] || \
             [ "${{ needs.code-quality.result }}" != "success" ] || \
             [ "${{ needs.integration-tests.result }}" != "success" ] || \
             [ "${{ needs.security.result }}" != "success" ] || \
             [ "${{ needs.build.result }}" != "success" ]; then
            echo "❌ **Pipeline Failed** - One or more jobs did not complete successfully" >> $GITHUB_STEP_SUMMARY
            exit 1
          else
            echo "✅ **All Jobs Passed Successfully!**" >> $GITHUB_STEP_SUMMARY
          fi
