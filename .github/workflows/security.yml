name: Security Scanning

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  schedule:
    # Run daily at 2am UTC
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  pull-requests: write

jobs:
  trivy-fs:
    name: Trivy Filesystem Scan
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner (filesystem)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-fs-results.sarif'
          severity: 'CRITICAL,HIGH,MEDIUM'
          exit-code: '0'
          ignore-unfixed: true

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        continue-on-error: true
        with:
          sarif_file: 'trivy-fs-results.sarif'

      - name: Run Trivy (table output for PR comments)
        uses: aquasecurity/trivy-action@master
        if: github.event_name == 'pull_request'
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'table'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'

  trivy-config:
    name: Trivy Config Scan
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Trivy config scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'config'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-config-results.sarif'
          severity: 'CRITICAL,HIGH,MEDIUM'
          exit-code: '0'

      - name: Upload Trivy config results
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        continue-on-error: true
        with:
          sarif_file: 'trivy-config-results.sarif'

  tfsec:
    name: tfsec Terraform Security
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install tfsec
        run: |
          curl -s https://raw.githubusercontent.com/aquasecurity/tfsec/master/scripts/install_linux.sh | bash

      - name: Run tfsec
        run: |
          tfsec deployments/terraform --format sarif --out tfsec-results.sarif --soft-fail || true

      - name: Upload tfsec results
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        continue-on-error: true
        with:
          sarif_file: 'tfsec-results.sarif'

  checkov:
    name: Checkov IaC Security
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Checkov
        run: pip install checkov

      - name: Run Checkov on Terraform
        run: |
          checkov --directory deployments/terraform/aws \
            --output sarif \
            --output-file-path . \
            --framework terraform \
            --compact \
            --quiet || true
        continue-on-error: true

      - name: Upload Checkov Terraform results
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        continue-on-error: true
        with:
          sarif_file: 'results_sarif.sarif'

      - name: Run Checkov on Docker
        run: |
          checkov --directory deployments/docker \
            --framework dockerfile \
            --compact \
            --quiet || true
        continue-on-error: true

  gosec:
    name: Gosec Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true

      - name: Install gosec
        run: go install github.com/securego/gosec/v2/cmd/gosec@latest

      - name: Run Gosec
        run: |
          gosec -fmt sarif -out gosec-results.sarif -no-fail ./... || true

      - name: Upload Gosec results
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        continue-on-error: true
        with:
          sarif_file: 'gosec-results.sarif'

  docker-scout:
    name: Docker Scout CVE Scan
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: deployments/docker/Dockerfile
          tags: aether:${{ github.sha }}
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Docker Scout scan
        uses: docker/scout-action@v1
        with:
          command: cves
          image: aether:${{ github.sha }}
          only-severities: critical,high
          exit-code: true

  secret-scan:
    name: Secret Scanning
    runs-on: ubuntu-latest
    # TruffleHog requires a diff between base and head; skip on scheduled runs
    if: github.event_name != 'schedule'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: TruffleHog OSS
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD
          extra_args: --only-verified

  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Dependency Review
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: moderate
          deny-licenses: GPL-3.0, AGPL-3.0

  security-summary:
    name: Security Summary
    runs-on: ubuntu-latest
    needs: [trivy-fs, trivy-config, tfsec, checkov, gosec]
    if: always()
    steps:
      - name: Check results
        run: |
          echo "Security scan results:"
          echo "Trivy FS: ${{ needs.trivy-fs.result }}"
          echo "Trivy Config: ${{ needs.trivy-config.result }}"
          echo "tfsec: ${{ needs.tfsec.result }}"
          echo "Checkov: ${{ needs.checkov.result }}"
          echo "Gosec: ${{ needs.gosec.result }}"
          echo "✅ Security scanning completed (see individual job results for details)"

      - name: Post summary
        if: always()
        run: |
          cat >> $GITHUB_STEP_SUMMARY << EOF
          # Security Scan Summary

          | Scanner | Result |
          |---------|--------|
          | Trivy FS | ${{ needs.trivy-fs.result }} |
          | Trivy Config | ${{ needs.trivy-config.result }} |
          | tfsec | ${{ needs.tfsec.result }} |
          | Checkov | ${{ needs.checkov.result }} |
          | Gosec | ${{ needs.gosec.result }} |

          See the [Security tab](https://github.com/${{ github.repository }}/security/code-scanning) for detailed results.
          EOF
